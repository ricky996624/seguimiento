<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seguimiento</title>
<meta name="theme-color" content="#17433B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seguimiento">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Archivo';font-weight:500;src:url(fonts/archivo-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Archivo';font-weight:700;src:url(fonts/archivo-latin-700-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Archivo';font-weight:800;src:url(fonts/archivo-latin-800-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Sans';font-weight:500;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Sans';font-weight:600;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');font-display:swap}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* Concepto: panel de trabajo de escritorio (lista de clientes + ficha con pestañas) y un informe claro y fijo para enviar al cliente. */
:root{
  --bg:#EDF0EE; --panel:#FFFFFF; --panel2:#F5F8F6; --ink:#14302B; --muted:#5B6E68; --line:#D3DCD8;
  --brand:#17433B; --brand-ink:#FFFFFF; --accent:#D9512A; --accent-ink:#FFFFFF; --soft:#DCE9E4;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#B8362B; --okbg:#E1F1E6; --warnbg:#FBEFD5; --badbg:#F8E0DC; --c2:#2F6FA3;
  --f-head:'Archivo','Arial Narrow',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A17; --panel:#15251F; --panel2:#1B2D26; --ink:#E6EEEB; --muted:#93A8A1; --line:#2B3F38;
  --brand:#1F5A4E; --soft:#223A33; --accent:#F0724A; --c2:#7DB2DE;
  --ok:#6FCB93; --warn:#E3B04F; --bad:#F08A7E; --okbg:#1D3B2A; --warnbg:#3C3118; --badbg:#46221D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A17; --panel:#15251F; --panel2:#1B2D26; --ink:#E6EEEB; --muted:#93A8A1; --line:#2B3F38;
  --brand:#1F5A4E; --soft:#223A33; --accent:#F0724A; --c2:#7DB2DE;
  --ok:#6FCB93; --warn:#E3B04F; --bad:#F08A7E; --okbg:#1D3B2A; --warnbg:#3C3118; --badbg:#46221D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px)}
.brandbar{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:16px 16px 14px;cursor:pointer;text-align:left;border:0;width:100%}
.brandbar h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brandbar p{margin:2px 0 0;font-size:12px;opacity:.8}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.list{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;padding-right:2px}
.cl{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer}
.cl:hover{border-color:var(--brand)}
.cl[aria-current="true"]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--accent)}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font:700 13px var(--f-head)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{color:#BFE3D6}}
:root[data-theme="dark"] .av{color:#BFE3D6}
.cl b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .txt{min-width:0;flex:1}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)}
.dot.amarillo{background:var(--warn)}.dot.rojo{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card + .card{margin-top:14px}
.head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea,.inl input,.inl select,.cell{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.f textarea{resize:vertical}
.full{grid-column:1/-1}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{display:block;font:500 26px var(--f-mono);margin-top:2px}
.stat i{font-style:normal;color:var(--muted);font-size:12px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.sec h3{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.bad{background:var(--badbg);color:var(--bad)}.alert.ok{background:var(--okbg);color:var(--ok)}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inl .f{flex:1 1 130px}
.mtr{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.mtr + .mtr{margin-top:10px}
.mtr header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.mtr header b{font-family:var(--f-head);font-size:15px}
.mtr .num{font:500 20px var(--f-mono)}
.delta{font:12px var(--f-mono);color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px;font-weight:600}
.tbl td{padding:4px 4px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n{font-family:var(--f-mono)}
.scroll{overflow-x:auto}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.day + .day{margin-top:10px}
.day .cell{background:var(--panel)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.gl{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.note{padding:10px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.savestate{font-size:12px;color:var(--muted)}
.back{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px #0004;z-index:50}
.repwrap{overflow-x:auto;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.opts{display:flex;gap:14px;flex-wrap:wrap}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--accent)}
details > summary{cursor:pointer;font-weight:600;padding:6px 0}
details.ag{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.atbl .tiny{width:66px;padding:5px 7px;font-family:var(--f-mono);text-align:right}
.atbl th:not(:first-child),.atbl td:not(:first-child){text-align:right}
.atbl td:first-child{min-width:190px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.tiles .stat b{font-size:20px}
/* calendario de asistencia */
.calh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.calh b{font:700 16px var(--f-head)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cal .d{height:54px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;font:500 13px var(--f-mono);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cal .d span{font-size:11px;white-space:nowrap}
.cal .d.prog{border:1px dashed var(--brand);background:var(--panel2);color:var(--ink)}
.cal .d.asistio{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.cal .d.falto{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.cal .d.cancelo{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.sel{outline:2px solid var(--ink);outline-offset:1px}
.cal .blank{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pend{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.pend:first-of-type{border-top:0}
.pend .pl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
/* seguimiento corporal */
.tg{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:16px;align-items:start}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.subh{font:700 14px 'Archivo',sans-serif;margin:18px 0 8px}
.subh:first-child{margin-top:0}
.tscroll{max-height:216px;overflow:auto}
.tabs2{display:flex;gap:8px;margin-bottom:14px}
.tabs2 .btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
/* agenda semanal */
.wkscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.wk{min-width:700px}
.wkhead{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.wkhead span{padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
.wkhead span:first-child{border-left:0}
.wkhead span b{display:block;font:700 16px var(--f-head);color:var(--ink)}
.wkhead span.today b{color:var(--accent)}
.wkbody{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));padding-bottom:10px}
.wkhours{position:relative}
.wkhours span{position:absolute;right:6px;font:11px var(--f-mono);color:var(--muted)}
.wkcol{position:relative;border-left:1px solid var(--line);height:672px;overflow:hidden}
.wkcol.today{background:var(--panel2)}
.slot{display:block;width:100%;height:48px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;padding:0}
.slot:first-child{border-top:0}
.slot:hover{background:var(--soft)}
.ev{position:absolute;border-radius:8px;padding:3px 6px;overflow:hidden;text-align:left;cursor:pointer;border:1px solid var(--brand);background:var(--soft);color:var(--ink);font-size:12px;line-height:1.2;z-index:2}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font:11px var(--f-mono);color:var(--muted)}
.ev.asistio{background:var(--okbg);border-color:var(--ok)}
.ev.falto{background:var(--badbg);border-color:var(--bad)}
.ev.cancelo{background:var(--warnbg);border-color:var(--warn);opacity:.8}
.ev.derived{border-style:dashed}
.wlist{padding:6px 0;border-top:1px solid var(--line)}
.wlist:first-of-type{border-top:0}
/* Informe: colores fijos, igual en claro y oscuro */
.rep{width:760px;background:#fff;color:#14302B;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
.rep *{box-sizing:border-box}
.rep .rh{background:#17433B;color:#fff;padding:30px 36px 26px;border-bottom:6px solid #D9512A}
.rep .rh small{display:block;font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.rep .rh h1{font:800 38px 'Archivo',sans-serif;letter-spacing:-.02em;margin:6px 0 4px}
.rep .rh p{margin:0;opacity:.85}
.rep .rb{padding:26px 36px 8px}
.rep .rk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.rep .rk div{background:#EEF4F1;border-radius:10px;padding:12px 14px}
.rep .rk small{display:block;font:600 10px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5B6E68}
.rep .rk b{display:block;font:500 26px 'IBM Plex Mono',monospace;margin-top:2px}
.rep h3{font:800 17px 'Archivo',sans-serif;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid #D9512A;display:inline-block}
.rep section{margin-bottom:24px}
.rep .rm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep .rc{border:1px solid #D3DCD8;border-radius:10px;padding:10px 12px}
.rep .rc header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rep .rc b{font:700 13px 'Archivo',sans-serif}
.rep .rc .v{font:500 18px 'IBM Plex Mono',monospace}
.rep .rc .d{font:11px 'IBM Plex Mono',monospace;color:#5B6E68}
.rep .gl2{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.rep .tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #9DB3AB;display:inline-block;margin-top:1px;position:relative}
.rep .tick.on{background:#2E7D4F;border-color:#2E7D4F}
.rep .tick.on::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rep .pd{border:1px solid #D3DCD8;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rep .pd b{font:700 13px 'Archivo',sans-serif;display:block;margin-bottom:4px}
.rep .pd div{font-size:12.5px;color:#34504A}
.rep .msg{background:#FFF4EE;border-left:5px solid #D9512A;padding:12px 16px;border-radius:0 10px 10px 0;white-space:pre-wrap}
.rep table{width:100%;border-collapse:collapse;font-size:13px}
.rep th{text-align:left;font:600 10px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5B6E68;padding:6px 8px;border-bottom:2px solid #D3DCD8}
.rep td{padding:7px 8px;border-bottom:1px solid #E3E9E6}
.rep th:not(:first-child),.rep td:not(:first-child){text-align:right;font-family:'IBM Plex Mono',monospace}
.rep .tg{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.rep .tg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rep .subh{margin:14px 0 6px}
.rep .fn{font-size:11px;color:#5B6E68;margin:6px 0 0}
.rep .rf{display:flex;justify-content:space-between;gap:12px;padding:14px 36px 22px;color:#5B6E68;font-size:12px;border-top:1px solid #D3DCD8;margin-top:6px}
@media (max-width:860px){
  input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px}
  .shell{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  body.show-main .side{display:none}
  body:not(.show-main) .main{display:none}
  .back{display:inline-flex;margin-bottom:10px}
  .tg,.tg2{grid-template-columns:1fr}
  .head h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <button class="brandbar" data-a="home" data-i="pend" aria-label="Ir al panel de pendientes"><h1>Seguimiento</h1><p>Clientes de entrenamiento 1 a 1</p></button>
    <div class="row" style="flex-wrap:nowrap"><button class="btn grow" data-a="home" data-i="agenda">Mi agenda</button><button class="btn pri grow" data-a="newClient">Nuevo cliente</button></div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn grow" data-a="syncBtn">↻ Sincronizar</button><button class="btn grow" data-a="home" data-i="datos">Datos y copias</button></div>
    <input type="file" id="syncfile" accept=".json,application/json" hidden>
    <input class="search" id="q" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente">
    <div class="list" id="list" role="list"></div>
    <label class="f"><span>Tu nombre en los informes</span><input id="trainer" placeholder="Nombre y apellidos o marca"></label>
    <div class="savestate" id="savestate" aria-live="polite"></div>
    <div class="savestate" id="cloudstate" aria-live="polite"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="libs/html2canvas.min.js"></script>
<script src="libs/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};

function fin(tr){const v=clean(tr);if(!v.length)return null;if(v.length===1)return v[0];if(v.length===2)return (v[0]+v[1])/2;return v.slice(0,3).sort((a,b)=>a-b)[1]}

function allVars(e){

/* almacén local (IndexedDB): todo se guarda en este dispositivo */
const Store=(()=>{
  let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('sin indexedDB'));return}
    const r=indexedDB.open('seguimiento',1);
    r.onupgradeneeded=()=>{const d=r.result;['clients','meta','backups'].forEach(n=>d.createObjectStore(n))};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }));
  const run=(store,mode,fn)=>open().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode),s=t.objectStore(store);const r=fn(s);
    t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  }));
  return {
    get:(st,k)=>run(st,'readonly',s=>s.get(k)),
    put:(st,k,v)=>run(st,'readwrite',s=>s.put(v,k)),
    del:(st,k)=>run(st,'readwrite',s=>s.delete(k)),
    clear:st=>run(st,'readwrite',s=>s.clear()),
    all:async st=>{const d=await open();return new Promise((res,rej)=>{
      const t=d.transaction(st,'readonly'),s=t.objectStore(st);const k=s.getAllKeys(),v=s.getAll();
      t.oncomplete=()=>{const o={};k.result.forEach((x,i)=>o[x]=v.result[i]);res(o)};t.onerror=()=>rej(t.error);
    })}
  };
})();

function touch(id){
  if(S.clients[id])S.clients[id].updatedAt=Date.now();
  dirty[id]=true;setSave('Guardando…');clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),500);
}
async function flush(id){
  if(inflight[id]){timers[id]=setTimeout(()=>flush(id),300);return}
  if(!dirty[id])return;
  if(!storeOk){dirty[id]=false;setSave('Este navegador no permite guardar datos: los cambios se perderán');return}
  if(!S.clients[id]){dirty[id]=false;return}
  dirty[id]=false;inflight[id]=true;
  try{await Store.put('clients',id,clone(S.clients[id]));setSave('Guardado en este dispositivo');scheduleSync()}
  catch(e){dirty[id]=true;setSave('No se pudo guardar. Reintentando…');timers[id]=setTimeout(()=>flush(id),4000)}
  finally{inflight[id]=false}
}

async function mergeData(inc){
  const st={added:0,updated:0,removed:0};
  const incC=inc.clients||{},incD=inc.deleted||{};
  const ids=new Set([...Object.keys(S.clients),...Object.keys(incC),...Object.keys(S.deleted),...Object.keys(incD)]);
  ids.forEach(id=>{
    const a=S.clients[id],b=incC[id];
    const ta=a?(a.updatedAt||0):-1,tb=b?(b.updatedAt||0):-1;
    const tdel=Math.max(S.deleted[id]||0,incD[id]||0);
    const win=tb>ta?b:a;
    if(tdel)S.deleted[id]=tdel;
    if(win&&tdel>(win.updatedAt||0)){if(a){delete S.clients[id];st.removed++}return}
    if(win===b&&b){if(a)st.updated++;else st.added++;S.clients[id]=clone(b)}
  });
  if(inc.trainer&&!S.trainer){S.trainer=inc.trainer;const t=$('#trainer');if(t)t.value=S.trainer}
  await persistAll();
  return st;
}

S.cloud=null;S.cloudMsg='';S.cloudErr='';S.pendingRender=false;
const SYNC_PATH='/contents/datos.enc.json';
const b64=u8=>{let s='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let keyCache={pass:'',salt:'',key:null};
async function getKey(pass,saltB64){
  if(keyCache.key&&keyCache.pass===pass&&keyCache.salt===saltB64)return keyCache.key;
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  keyCache={pass,salt:saltB64,key};return key;
}
async function encryptObj(obj,pass,saltB64){
  saltB64=saltB64||b64(crypto.getRandomValues(new Uint8Array(16)));
  const key=await getKey(pass,saltB64),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {text:JSON.stringify({v:1,salt:saltB64,iv:b64(iv),ct:b64(ct)}),salt:saltB64};
}
async function decryptText(text,pass){
  const f=JSON.parse(text);const key=await getKey(pass,f.salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},key,unb64(f.ct));
  return {data:JSON.parse(new TextDecoder().decode(pt)),salt:f.salt};
}
const dsig=d=>Object.keys(d.clients||{}).sort().map(i=>i+':'+(d.clients[i].updatedAt||0)).join(',')+'|'+Object.keys(d.deleted||{}).sort().map(i=>i+':'+d.deleted[i]).join(',');

  const d=$('#cloudline');if(d){d.textContent=msg;d.style.color=err?'var(--bad)':''}}

  const c=S.cloud;opt=opt||{};
  return fetch('https://api.github.com/repos/'+c.repo+path,Object.assign({},opt,{cache:'no-store',headers:Object.assign({Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'},opt.headers||{})}));

async function syncNow(manual){
  const c=S.cloud;if(!c||!c.repo||!c.token||!c.pass||!storeOk)return false;
  if(!navigator.onLine){setCloud('Sin conexión: se sincronizará al volver',false);return false}
  if(syncBusy){syncAgain=true;return false}
  syncBusy=true;lastTry=Date.now();setCloud('Sincronizando…');
  let ok=false;
  try{
    for(let attempt=0;attempt<4;attempt++){
      const headers={};if(c.etag&&!manual&&attempt===0)headers['If-None-Match']=c.etag;
      const r=await ghApi(SYNC_PATH,{headers});
      let remote=null,changedLocal=false;
      if(r.status===304){/* sin cambios en la nube */}
      else if(r.status===200){
        const j=await r.json();let text;
        if(j.content){text=atob(j.content.replace(/\s/g,''));try{text=decodeURIComponent(escape(text))}catch(e){}}
        else{const br=await ghApi('/git/blobs/'+j.sha);const bj=await br.json();text=atob(bj.content.replace(/\s/g,''))}
        try{const dd=await decryptText(text,c.pass);remote=dd.data;c.salt=dd.salt}catch(e){setCloud('La frase de cifrado no coincide con la de la nube. No se ha cambiado nada.',true);return false}
        if(remote.app!=='seguimiento-clientes')throw new Error('formato');
        c.sha=j.sha;c.etag=r.headers.get('ETag')||null;
        const st=await mergeData(remote);
        changedLocal=st.added+st.updated+st.removed>0;
        c.sig=dsig(remote);
      }else if(r.status===404){
        const rr=await ghApi('');
        if(rr.status===404||rr.status===401||rr.status===403){setCloud(rr.status===401?'El token no es válido o ha caducado. Crea uno nuevo.':'No encuentro el repositorio o el token no tiene acceso a él.',true);return false}
        c.sha=null;c.etag=null;c.sig='';
      }else if(r.status===401){setCloud('El token no es válido o ha caducado. Crea uno nuevo.',true);return false}
      else if(r.status===403||r.status===429){setCloud('GitHub pide esperar un poco. Se reintentará solo.',true);return false}
      else throw new Error('HTTP '+r.status);
      const cur=exportData();
      const need=dsig(cur)!==(c.sig||'')&&(Object.keys(cur.clients).length||Object.keys(cur.deleted).length);
      if(changedLocal)renderAfterSync();
      if(!need){ok=true;break}
      const enc=await encryptObj(cur,c.pass,c.salt);c.salt=enc.salt;
      if(enc.text.length>900000)setCloud('Aviso: los datos ya pesan casi 1 MB; avísame para ampliar el sistema.',true);
      const body={message:'sync '+new Date().toISOString(),content:btoa(enc.text)};if(c.sha)body.sha=c.sha;
      const pr=await ghApi(SYNC_PATH,{method:'PUT',body:JSON.stringify(body)});
      if(pr.status===200||pr.status===201){const pj=await pr.json();c.sha=pj.content.sha;c.etag=null;c.sig=dsig(cur);ok=true;break}
      if(pr.status===409||pr.status===422){c.etag=null;c.sha=null;continue}
      if(pr.status===401||pr.status===403){setCloud('El token no puede escribir en el repositorio (permiso Contents: Read and write) o ha caducado.',true);return false}
      throw new Error('PUT '+pr.status);
    }
    if(ok){S.lastSync=Date.now();await Store.put('meta','lastSync',S.lastSync);await saveCloudMeta();setCloud('Sincronizado a las '+hhmm(S.lastSync));
      if(S.home==='datos'&&!S.sel)renderMain()}
    else setCloud('No se pudo sincronizar. Se reintentará.',true);
  }catch(e){setCloud('No se pudo sincronizar ('+(e&&e.message||'error')+'). Se reintentará.',true)}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;scheduleSync(1500)}}
  return ok;
}
function startAutoSync(){
  if(S.cloud)syncNow(true);
  document.addEventListener('visibilitychange',()=>{if(S.cloud&&document.visibilityState==='visible'&&Date.now()-lastTry>10000)syncNow(false)});
  window.addEventListener('online',()=>{if(S.cloud)syncNow(true)});
  window.addEventListener('focus',()=>{if(S.cloud&&Date.now()-lastTry>10000)syncNow(false)});
  setInterval(()=>{if(document.visibilityState==='visible'&&S.cloud)syncNow(false)},45000);
}

/* ---------- cálculos ---------- */
const sorted=a=>a.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
function metricGroups(c,cat,since){
  const g={};
  (c.metrics||[]).filter(m=>m.cat===cat&&(!since||m.date>=since)).forEach(m=>{(g[m.name]=g[m.name]||[]).push(m)});
  Object.keys(g).forEach(k=>g[k]=sorted(g[k]));
  return g;
}
function sessStats(c,since){
  const ss=(c.sessions||[]).filter(s=>s.status!=='prog'&&(!since||s.date>=since));
  const ok=ss.filter(s=>s.status==='asistio');
  const rp=ok.map(s=>toNum(s.rpe)).filter(v=>v!=null);
  return {total:ss.length,ok:ok.length,pct:ss.length?Math.round(ok.length/ss.length*100):null,rpe:rp.length?rp.reduce((a,b)=>a+b,0)/rp.length:null,
    last:sorted(c.sessions||[]).filter(s=>s.status==='asistio').pop()};
}
function bonoInfo(c){
  const b=c.bono||{};const total=Number(b.total)||0;
  const used=(c.sessions||[]).filter(s=>s.status==='asistio'&&(!b.start||s.date>=b.start)).length;
  return {type:b.type||'bono',total,used,left:Math.max(total-used,0),name:b.name,paid:b.paid,price:b.price,expires:b.expires,start:b.start};
}
function alertsFor(c){
  const out=[];const t=today();
  if(c.semaforo&&c.semaforo!=='verde')out.push({lv:SEM[c.semaforo][1],t:SEM[c.semaforo][0]+(c.semaforoNota?'. '+c.semaforoNota:'')});
  const bo=bonoInfo(c);
  if(bo.type==='bono'&&bo.total){
    if(bo.left===0)out.push({lv:'bad',t:'El bono está agotado.'});
    else if(bo.left<=2)out.push({lv:'warn',t:'Quedan '+bo.left+' sesiones del bono.'});
  }
  if(bo.expires){
    if(bo.expires<t)out.push({lv:'bad',t:'El bono caducó el '+fmtD(bo.expires)+'.'});
    else if(daysBetween(t,bo.expires)<=14)out.push({lv:'warn',t:'El bono caduca el '+fmtD(bo.expires)+'.'});
  }
  if((bo.total||bo.price)&&!bo.paid)out.push({lv:'warn',t:'Pago pendiente.'});
  const um=unmarked(c);if(um)out.push({lv:'warn',t:'Tienes '+um+(um===1?' sesión pasada sin marcar':' sesiones pasadas sin marcar')+' (últimos 14 días). Ábrelas en Sesiones y bono.'});
  if(c.nextReview){
    if(c.nextReview<t)out.push({lv:'bad',t:'Revisión atrasada desde el '+fmtD(c.nextReview)+'.'});
    else if(daysBetween(t,c.nextReview)<=7)out.push({lv:'warn',t:'Revisión el '+fmtD(c.nextReview)+'.'});
  }
  const last=sorted(c.sessions||[]).filter(s=>s.status==='asistio').pop();
  if(c.status==='activo'&&last&&daysBetween(last.date,t)>21)out.push({lv:'warn',t:'Sin sesiones desde hace '+daysBetween(last.date,t)+' días.'});
  const d=c.docs||{};const miss=[];
  if(!d.rgpd)miss.push('RGPD');if(!d.consent)miss.push('consentimiento informado');if(!d.parq)miss.push('PAR-Q+');
  if(miss.length)out.push({lv:'warn',t:'Falta documentación: '+miss.join(', ')+'.'});
  return out;
}

/* ---------- horario: sesiones previstas ---------- */
function sessionFor(c,iso){
  const s=(c.sessions||[]).find(x=>x.date===iso);if(s)return s;
  if(c.status!=='activo')return null;
  const sl=((c.sched||{}).slots||[]).find(x=>+x.dow===dowOf(iso)&&(!x.from||iso>=x.from));
  return sl?{derived:true,date:iso,status:'prog',time:sl.time,dur:Number(sl.dur)||60}:null;
}
function ensureEntry(c,iso){
  c.sessions=c.sessions||[];
  let s=c.sessions.find(x=>x.date===iso);
  if(!s){const d=sessionFor(c,iso);s={id:uid(),date:iso,status:'prog',rpe:'',note:'',time:d?d.time:'',dur:d?d.dur:60};c.sessions.push(s)}
  return s;
}
function unmarked(c){let n=0;const t=today();for(let i=1;i<=14;i++){const s=sessionFor(c,addDays(t,-i));if(s&&s.status==='prog')n++}return n}
function nextSession(c){const t=today();for(let i=0;i<=35;i++){const d=addDays(t,i),s=sessionFor(c,d);if(s&&(s.status==='prog'))return {date:d,time:s.time}}return null}

/* ---------- seguimiento corporal: series, composición, somatotipo ---------- */
const TRK_ANT={mass:'mass',arm:'g_armr',waist:'g_waist',hip:'g_hip'};
function series(c,key,since){
  const m={};
  (c.anthro||[]).forEach(e=>{const v=allVars(e)[TRK_ANT[key]];if(v!=null)m[e.date]={date:e.date,value:v,src:'isak'}});
  (c.track||[]).forEach(t=>{const v=toNum(t[key]);if(v!=null)m[t.date]={date:t.date,value:v,src:'reg',id:t.id}});
  return sorted(Object.values(m)).filter(p=>!since||p.date>=since);
}
function lastTrack(c,key){const a=sorted((c.track||[]).filter(t=>toNum(t[key])!=null));const t=a[a.length-1];return t?{date:t.date,value:toNum(t[key])}:null}
const ageAt=(birth,iso)=>birth?(new Date(iso+'T12:00:00')-new Date(birth+'T12:00:00'))/(365.25*864e5):null;
const DW={M:[[17,20,1.1620,.0630],[20,30,1.1631,.0632],[30,40,1.1422,.0544],[40,50,1.1620,.0700],[50,200,1.1715,.0779]],
          F:[[17,20,1.1549,.0678],[20,30,1.1599,.0717],[30,40,1.1423,.0632],[40,50,1.1333,.0612],[50,200,1.1339,.0645]]};
const BF_NAME={dw:'Durnin-Womersley + Siri',fa:'Faulkner'};
function missingOf(v,keys){return keys.filter(k=>v[k]==null).map(k=>SITE[k].name)}
function bfBy(c,e,m){
  const v=allVars(e);
  if(m==='fa'){const k=['sf_tri','sf_sub','sf_sup','sf_abd'];if(missingOf(v,k).length)return null;return {pct:k.reduce((a,x)=>a+v[x],0)*0.153+5.783,method:'fa'}}
  const k=['sf_bic','sf_tri','sf_sub','sf_ili'];
  if(!c.sex||!c.birth||missingOf(v,k).length)return null;
  const age=ageAt(c.birth,e.date);if(age==null||age<17)return null;
  const row=DW[c.sex].find(r=>age>=r[0]&&age<r[1]);if(!row)return null;
  const d=row[2]-row[3]*Math.log10(k.reduce((a,x)=>a+v[x],0));
  return {pct:495/d-450,method:'dw'};
}
function bfEstimate(c,e){const p=c.bfMethod||'dw';return bfBy(c,e,p)||bfBy(c,e,p==='dw'?'fa':'dw')}
function bfLatest(c){
  const cand=[];
  (c.track||[]).forEach(t=>{const v=toNum(t.bf);if(v!=null)cand.push({date:t.date,pct:v,src:'registro manual',pri:1})});
  (c.anthro||[]).forEach(e=>{const r=bfEstimate(c,e);if(r)cand.push({date:e.date,pct:r.pct,src:BF_NAME[r.method]+' (pliegues)',pri:0})});
  cand.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.pri-b.pri);
  return cand.pop()||null;
}
function compInfo(c){
  const bf=bfLatest(c),ms=series(c,'mass'),m=ms.length?ms[ms.length-1]:null,ma=lastTrack(c,'metage');
  let fat=null,ffm=null;if(bf&&m){fat=m.value*bf.pct/100;ffm=m.value-fat}
  return {bf,m,ma,fat,ffm};
}
function somato(e){
  const v=allVars(e);
  const need=['stature','mass','sf_tri','sf_sub','sf_sup','sf_cal','b_hum','b_fem','g_armf','g_calf'];
  const miss=missingOf(v,need);if(miss.length)return {miss};
  const X=(v.sf_tri+v.sf_sub+v.sf_sup)*(170.18/v.stature);
  const endo=-0.7182+0.1451*X-0.00068*X*X+0.0000014*X*X*X;
  const ca=v.g_armf-v.sf_tri/10,cc=v.g_calf-v.sf_cal/10;
  const meso=0.858*v.b_hum+0.601*v.b_fem+0.188*ca+0.161*cc-0.131*v.stature+4.5;
  const hwr=v.stature/Math.cbrt(v.mass);
  const ecto=hwr>=40.75?0.732*hwr-28.58:hwr>38.25?0.463*hwr-17.63:0.1;
  const r=[['Endomorfia',Math.max(endo,0.1)],['Mesomorfia',Math.max(meso,0.1)],['Ectomorfia',Math.max(ecto,0.1)]];
  const top=r.slice().sort((a,b)=>b[1]-a[1]);
  return {endo:r[0][1],meso:r[1][1],ecto:r[2][1],dom:top[0][0]};
}
const f1=n=>Number(n).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});

/* ---------- gráficas ---------- */
function chart(pts,o){
  o=o||{};const C=o.c||'var(--accent)',T=o.t||'var(--muted)',G=o.g||'var(--line)';
  const W=o.w||560,H=o.h||170,L=46,R=16,Tp=16,B=26;
  const ts=pts.map(p=>new Date(p.date+'T12:00:00').getTime());
  const vs=pts.map(p=>p.value);
  let lo=Math.min(...vs),hi=Math.max(...vs);
  if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
  const t0=Math.min(...ts),t1=Math.max(...ts);
  const X=t=>t1===t0?(L+(W-L-R)/2):L+(t-t0)/(t1-t0)*(W-L-R);
  const Y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  let g='';
  const rng=hi-lo,raw=rng/3,mag=Math.pow(10,Math.floor(Math.log10(raw))),nf=raw/mag;
  const step=(nf<1.5?1:nf<3.5?2:nf<7.5?5:10)*mag;
  const ticks=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)ticks.push(Math.round(v/step)*step);
  ticks.forEach(v=>{const y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${G}" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${T}" font-family="IBM Plex Mono,monospace">${num(v)}</text>`});
  const d=pts.map((p,i)=>(i?'L':'M')+X(ts[i]).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${X(ts[i]).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?C:'#fff'}" stroke="${C}" stroke-width="2"/>`).join('');
  const lx=X(ts[ts.length-1]),ly=Y(vs[vs.length-1]);
  const anchor=lx>W-60?'end':'middle';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución" style="display:block;max-width:100%">${g}
    <path d="${d}" fill="none" stroke="${C}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text x="${lx}" y="${ly-10}" text-anchor="${anchor}" font-size="12" font-weight="600" fill="${o.lab||'currentColor'}" font-family="IBM Plex Mono,monospace">${num(vs[vs.length-1])}</text>
    <text x="${L}" y="${H-6}" font-size="11" fill="${T}" font-family="IBM Plex Mono,monospace">${fmtS(pts[0].date)}</text>
    ${pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="${T}" font-family="IBM Plex Mono,monospace">${fmtS(pts[pts.length-1].date)}</text>`:''}</svg>`;
}
function chartMulti(list,o){
  o=o||{};const T=o.t||'var(--muted)',G=o.g||'var(--line)';
  const cols=[o.c||'var(--accent)',o.c2||'var(--c2)'];
  const W=o.w||560,H=o.h||200,L=46,R=18,Tp=30,B=26;
  const all=[].concat(...list.map(s=>s.pts));
  const ts=all.map(p=>new Date(p.date+'T12:00:00').getTime()),vs=all.map(p=>p.value);
  let lo=Math.min(...vs),hi=Math.max(...vs);if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const t0=Math.min(...ts),t1=Math.max(...ts);
  const X=t=>t1===t0?(L+(W-L-R)/2):L+(t-t0)/(t1-t0)*(W-L-R);
  const Y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  const raw=(hi-lo)/3,mag=Math.pow(10,Math.floor(Math.log10(raw))),nf=raw/mag,step=(nf<1.5?1:nf<3.5?2:nf<7.5?5:10)*mag;
  let g='';for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){const y=Y(Math.round(v/step)*step);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${G}"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${T}" font-family="IBM Plex Mono,monospace">${num(Math.round(v/step)*step)}</text>`}
  const lastOf=list.map(s=>s.pts.length?s.pts[s.pts.length-1].value:null);
  let body='',leg='',lx0=L;
  list.forEach((s,i)=>{
    const C=cols[i];if(!s.pts.length)return;
    const d=s.pts.map((p,j)=>(j?'L':'M')+X(new Date(p.date+'T12:00:00').getTime()).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ');
    body+=`<path d="${d}" fill="none" stroke="${C}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    body+=s.pts.map((p,j)=>`<circle cx="${X(new Date(p.date+'T12:00:00').getTime()).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="${j===s.pts.length-1?5:3}" fill="${j===s.pts.length-1?C:'#fff'}" stroke="${C}" stroke-width="2"/>`).join('');
    const lp=s.pts[s.pts.length-1],x=X(new Date(lp.date+'T12:00:00').getTime()),y=Y(lp.value);
    const above=list.length<2||lastOf[i]>=Math.min(...lastOf.filter(v=>v!=null))&&(i===0?lastOf[0]>=(lastOf[1]==null?-1e9:lastOf[1]):lastOf[1]>lastOf[0]);
    body+=`<text x="${x}" y="${above?y-10:y+18}" text-anchor="${x>W-60?'end':'middle'}" font-size="12" font-weight="600" fill="${o.lab||'currentColor'}" font-family="IBM Plex Mono,monospace">${num(lp.value)}</text>`;
    leg+=`<line x1="${lx0}" x2="${lx0+18}" y1="12" y2="12" stroke="${C}" stroke-width="3" stroke-linecap="round"/><text x="${lx0+24}" y="16" font-size="12" fill="${o.lab||'currentColor'}" font-family="IBM Plex Sans,sans-serif">${esc(s.name)}</text>`;
    lx0+=36+s.name.length*7;
  });
  const dmin=new Date(t0).toISOString().slice(0,10),dmax=new Date(t1).toISOString().slice(0,10);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución" style="display:block;max-width:100%">${leg}${g}${body}
    <text x="${L}" y="${H-6}" font-size="11" fill="${T}" font-family="IBM Plex Mono,monospace">${fmtS(dmin)}</text>${t1>t0?`<text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="${T}" font-family="IBM Plex Mono,monospace">${fmtS(dmax)}</text>`:''}</svg>`;
}
function deltaTxt(pts){
  if(pts.length<2)return 'Primera medida';
  const d=pts[pts.length-1].value-pts[0].value;
  return (d>0?'+':'')+num(d)+' desde el '+fmtD(pts[0].date);
}

function bonoAlerts(c){
  const out=[];const t=today();const bo=bonoInfo(c);
  if(c.status!=='activo')return out;
  if(bo.type==='bono'&&bo.total){if(bo.left===0)out.push('bono agotado');else if(bo.left<=2)out.push('quedan '+bo.left+(bo.left===1?' sesión':' sesiones'))}

}

function weekEvents(ws){
  const ev=[];
  Object.keys(S.clients).forEach(id=>{const c=S.clients[id];
    for(let i=0;i<7;i++){const iso=addDays(ws,i),s=sessionFor(c,iso);if(!s)continue;const a=toMin(s.time);if(a==null)continue;
      ev.push({id,name:c.name||'Sin nombre',date:iso,day:i,start:a,end:a+(Number(s.dur)||60),status:s.status,derived:!!s.derived})}});
  return ev;
}
function layoutDay(evs){
  evs.sort((a,b)=>a.start-b.start||a.end-b.end);
  let cluster=[],clEnd=-1,laneEnd=[];
  const flush=()=>{const n=Math.max(...cluster.map(e=>e.lane))+1;cluster.forEach(e=>e.lanes=n);cluster=[];laneEnd=[];clEnd=-1};
  evs.forEach(e=>{
    if(cluster.length&&e.start>=clEnd)flush();
    let l=laneEnd.findIndex(x=>x<=e.start);if(l<0)l=laneEnd.length;
    laneEnd[l]=e.end;e.lane=l;cluster.push(e);clEnd=Math.max(clEnd,e.end);
  });
  if(cluster.length)flush();
}
function agendaHTML(){
  const ws=S.ag.ws,t=today();
  const ev=weekEvents(ws);
  const d1=new Date(ws+'T12:00:00'),d2=new Date(addDays(ws,6)+'T12:00:00');
  const mo=d=>d.toLocaleDateString('es-ES',{month:'long'});
  const title=d1.getMonth()===d2.getMonth()?`${d1.getDate()} – ${d2.getDate()} de ${mo(d2)} de ${d2.getFullYear()}`:`${d1.getDate()} de ${mo(d1)} – ${d2.getDate()} de ${mo(d2)} de ${d2.getFullYear()}`;
  let head='<span></span>',cols='',lists='';
  for(let i=0;i<7;i++){
    const iso=addDays(ws,i),isT=iso===t;
    head+=`<span class="${isT?'today':''}">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i]}<b>${+iso.slice(8)}</b></span>`;
    const de=ev.filter(e=>e.day===i);layoutDay(de);
    cols+=`<div class="wkcol${isT?' today':''}">${Array.from({length:14},(_,h)=>`<button class="slot" data-a="agAdd" data-i="${iso}" data-j="${7+h}:00" aria-label="Añadir sesión el ${fmtD(iso)} a las ${7+h}:00"></button>`).join('')}
      ${de.map(e=>{const top=Math.max(0,(e.start-420)*0.8),h=Math.max(22,(e.end-e.start)*0.8-2);
        return `<button class="ev ${e.status}${e.derived?' derived':''}" data-a="agOpen" data-i="${e.id}" data-j="${e.date}" style="top:${top}px;height:${h}px;left:calc(${e.lane/e.lanes*100}% + 2px);width:calc(${100/e.lanes}% - 4px)" title="${esc(e.name)} · ${hmin(e.start)}–${hmin(e.end)} · ${SESS[e.status]}"><b>${esc(e.name)}</b><small>${hmin(e.start)}–${hmin(e.end)}</small></button>`}).join('')}</div>`;
    const sorted2=de.slice().sort((a,b)=>a.start-b.start);
    lists+=`<div class="wlist"><b>${longDay(iso)}</b>${sorted2.length?sorted2.map(e=>`<div class="row" style="gap:8px"><span class="delta">${hmin(e.start)} a ${hmin(e.end)}</span><span class="grow">${esc(e.name)}</span><span class="muted" style="font-size:12px">${MARK[e.status]} ${SESS[e.status]}</span></div>`).join(''):'<div class="muted" style="font-size:12px">Sin sesiones</div>'}</div>`;
  }
  const hours=Array.from({length:15},(_,i)=>`<span style="top:${i*48}px;transform:translateY(${i?'-50%':'0'})">${7+i}:00</span>`).join('');
  const add=S.ag.add;
  const cl=Object.keys(S.clients).filter(id=>S.clients[id].status!=='baja').sort((a,b)=>(S.clients[a].name||'').localeCompare(S.clients[b].name||'','es'));
  const addP=add?`<div class="card" style="margin-top:12px;background:var(--panel2)"><div class="sec"><h3>Añadir sesión</h3><button class="btn sm ghost" data-a="agCancel">Cerrar</button></div>
    ${cl.length?`<div class="inl"><label class="f" style="flex:2 1 200px"><span>Cliente</span><select id="ag-c">${cl.map(id=>`<option value="${id}">${esc(S.clients[id].name||'Sin nombre')}</option>`).join('')}</select></label>
    <label class="f"><span>Día</span><input id="ag-d" type="date" value="${add.date}"></label>
    <label class="f"><span>Hora</span><input id="ag-t" type="time" value="${String(add.time).padStart(5,'0')}"></label>
    <label class="f"><span>Duración</span><select id="ag-u">${[30,45,60,90].map(n=>`<option value="${n}"${n===60?' selected':''}>${n} min</option>`).join('')}</select></label>
    <button class="btn pri" data-a="agDoAdd">Añadir</button></div>`:'<div class="empty">Crea primero un cliente.</div>'}</div>`:'';
  return `${bonoBanner()}<div class="calh"><span class="row"><button class="btn sm" data-a="agPrev" aria-label="Semana anterior">‹</button><button class="btn sm" data-a="agToday">Hoy</button><button class="btn sm" data-a="agNext" aria-label="Semana siguiente">›</button></span><b>${title}</b></div>
  <div class="wkscroll"><div class="wk"><div class="wkhead">${head}</div><div class="wkbody"><div class="wkhours">${hours}</div>${cols}</div></div></div>
  <div class="legend"><span>Toca un hueco para añadir una sesión · toca una sesión para abrir al cliente</span><span>Borde discontinuo: sesión prevista del horario habitual</span></div>${addP}
  <details style="margin-top:14px"${innerWidth<860?' open':''}><summary>Lista de la semana</summary>${lists}</details>`;
}

/* ---------- valoraciones: antropometría ISAK ---------- */
function diffCell(tr,tol){
  const p=diffPct(tr);if(p==null||!tol)return '';
  const t=num(p)+' %';
  return clean(tr).length===2&&p>tol?`<span class="chip warn">${t} · mide una 3.ª</span>`:t;
}
function anthroGroup(e,g){
  const rows=g.sites.map(([k,name,unit])=>{
    const tr=(e.v&&e.v[k])||[];const f=fin(tr);const tol=SITE[k].mass?0:g.tol;
    return `<tr><td>${esc(name)} <span class="muted">${unit}</span></td>${[0,1,2].map(n=>`<td><input class="cell tiny" data-ak="${k}" data-ai="${n}" inputmode="decimal" value="${tr[n]==null?'':String(tr[n]).replace('.',',')}" aria-label="${esc(name)}, medida ${n+1}"></td>`).join('')}<td class="n" id="fv-${k}"><b>${f==null?'—':num(f)}</b></td><td class="n" id="fd-${k}">${diffCell(tr,tol)}</td></tr>`}).join('');
  return `<details class="ag" ${g.open?'open':''}><summary>${g.title} <span class="muted">(${g.unit})</span></summary><div class="scroll"><table class="tbl atbl"><thead><tr><th>Medida</th><th>1.ª</th><th>2.ª</th><th>3.ª</th><th>Valor</th><th>Dif.</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function derivedHTML(e){
  const v=allVars(e);
  const T=[['sum6','Σ6 pliegues','mm'],['sum8','Σ8 pliegues','mm'],['bmi','IMC','kg/m²'],['whr','Cintura / cadera',''],['legs','Long. de piernas','cm'],['cormic','Índice córmico','%']];
  return T.map(([k,n,u])=>`<div class="stat"><small>${n}</small><b>${v[k]!=null?fmtV(k,v[k]):'—'}</b><i>${u||'&nbsp;'}</i></div>`).join('');
}
function compHTML(c,e){
  const v=allVars(e),age=ageAt(c.birth,e.date);
  const dw=bfBy(c,e,'dw'),fa=bfBy(c,e,'fa'),pref=bfEstimate(c,e);
  const dwWhy=!c.sex?'Indica el sexo en la ficha':!c.birth?'Falta la fecha de nacimiento':(age!=null&&age<17)?'La ecuación vale desde los 17 años':'Falta: '+missingOf(v,['sf_bic','sf_tri','sf_sub','sf_ili']).join(', ');
  const faWhy='Falta: '+missingOf(v,['sf_tri','sf_sub','sf_sup','sf_abd']).join(', ');
  const st=(k,r,why,sub)=>`<div class="stat"><small>${k}</small><b>${r?f1(r.pct)+' %':'—'}</b><i>${r?sub:esc(why)}</i></div>`;
  const so=somato(e);
  const mass=v.mass;
  const fm=pref&&mass!=null?mass*pref.pct/100:null;
  return `<div class="subh" style="margin-top:20px">Composición corporal (estimación)</div>
  <div class="tiles">${st('% grasa · Durnin-Womersley',dw,dwWhy,'4 pliegues + Siri')}${st('% grasa · Faulkner',fa,faWhy,'4 pliegues')}
    ${fm!=null?`<div class="stat"><small>Masa libre de grasa</small><b>${f1(mass-fm)} kg</b><i>masa grasa ${f1(fm)} kg</i></div>`:`<div class="stat"><small>Masa libre de grasa</small><b>—</b><i>${mass==null?'Falta la masa corporal':'Falta el % de grasa'}</i></div>`}
    ${so.miss?`<div class="stat" style="grid-column:span 2"><small>Somatotipo (Heath-Carter)</small><b>—</b><i>Falta: ${esc(so.miss.join(', '))}</i></div>`:`<div class="stat" style="grid-column:span 2"><small>Somatotipo (Heath-Carter)</small><b>${f1(so.endo)} – ${f1(so.meso)} – ${f1(so.ecto)}</b><i>endo – meso – ecto · predomina: ${so.dom.toLowerCase()}</i></div>`}</div>
  <div class="inl" style="margin-top:10px"><label class="f" style="max-width:300px"><span>Ecuación que usa el Resumen</span><select data-p="bfMethod"><option value="dw"${(c.bfMethod||'dw')==='dw'?' selected':''}>Durnin-Womersley + Siri</option><option value="fa"${c.bfMethod==='fa'?' selected':''}>Faulkner</option></select></label></div>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Durnin-Womersley usa bíceps, tríceps, subescapular y cresta ilíaca, con coeficientes por sexo y edad (desde 17 años). Faulkner usa tríceps, subescapular, supraespinal y abdominal. La masa libre de grasa es peso − masa grasa e incluye músculo, hueso, agua y órganos: no es solo músculo. El somatotipo necesita estatura, masa, pliegues (tríceps, subescapular, supraespinal, pantorrilla), diámetros del húmero y fémur, y perímetros de brazo contraído y pantorrilla.</p>`;
}
function aSession(c){
  const an=c.anthro||[];if(!an.length)return null;
  let e=an.find(x=>x.id===S.aSel);
  if(!e){e=sorted(an).pop();S.aSel=e.id}
  return e;
}
function evoHTML(c){
  const an=sorted(c.anthro||[]);
  const withData=Object.keys(VARNAME).filter(k=>an.some(s=>allVars(s)[k]!=null));
  if(!withData.includes(S.avar))S.avar=withData[0]||'mass';
  const pts=an.map(s=>({date:s.date,value:allVars(s)[S.avar]})).filter(p=>p.value!=null);
  const first=an[0]&&allVars(an[0]),last=an[an.length-1]&&allVars(an[an.length-1]);
  const cmp=an.length>1?['mass','sum6','sum8','g_waist','g_hip','g_armf','g_thim','bmi'].filter(k=>first[k]!=null&&last[k]!=null):[];
  return `<div class="sec"><h3>Evolución corporal</h3><label class="f" style="min-width:230px"><select id="avar" aria-label="Variable">${withData.map(k=>`<option value="${k}"${k===S.avar?' selected':''}>${esc(VARNAME[k][0])}</option>`).join('')}</select></label></div>
    ${pts.length?`<div class="mtr"><header><b>${esc(VARNAME[S.avar][0])}</b><span class="num">${fmtV(S.avar,pts[pts.length-1].value)} <small class="muted">${esc(VARNAME[S.avar][1])}</small></span></header>${chart(pts,{h:160})}<div class="delta">${deltaTxt(pts)}</div></div>`:`<div class="empty">Sin datos de esta variable todavía.</div>`}
    ${cmp.length?`<div class="scroll"><table class="tbl" style="margin-top:12px"><thead><tr><th>Variable</th><th>Primera (${fmtD(an[0].date)})</th><th>Última (${fmtD(an[an.length-1].date)})</th><th>Cambio</th></tr></thead><tbody>${cmp.map(k=>{const dl=last[k]-first[k];return `<tr><td>${esc(VARNAME[k][0])} <span class="muted">${VARNAME[k][1]}</span></td><td class="n">${fmtV(k,first[k])}</td><td class="n">${fmtV(k,last[k])}</td><td class="n">${dl>0?'+':''}${fmtV(k,dl)}</td></tr>`}).join('')}</tbody></table></div>`:''}`;
}
function anthroCard(c){

    <div class="empty">Aún no hay mediciones. Cada medición guarda hasta tres repeticiones por punto, calcula el valor final según la norma ISAK y las sumas de pliegues.</div></div>`;
  const idx=(c.anthro||[]).findIndex(x=>x.id===e.id);

  const pts=an.map(s=>({date:s.date,value:allVars(s)[S.avar]})).filter(p=>p.value!=null);
  const first=an[0]&&allVars(an[0]),last=an[an.length-1]&&allVars(an[an.length-1]);
  const cmp=an.length>1?['mass','sum6','sum8','g_waist','g_hip','g_armf','g_thim','bmi'].filter(k=>first[k]!=null&&last[k]!=null):[];
  return `<div class="card"><div class="sec"><h3>Antropometría (ISAK)</h3><span class="row"><button class="btn pri" data-a="newAnthro">Nueva medición</button></span></div>
  <div class="inl">
    <label class="f"><span>Medición</span><select id="asel">${an.slice().reverse().map(s=>`<option value="${s.id}"${s.id===e.id?' selected':''}>${fmtD(s.date)}</option>`).join('')}</select></label>
    ${fld('Fecha','anthro.'+idx+'.date',e.date,{type:'date'})}
    ${fld('Lado medido','anthro.'+idx+'.side',e.side||'D',{type:'select',opts:[['D','Derecho'],['I','Izquierdo']]})}
    <label class="f" style="flex:2 1 200px"><span>Notas</span><input data-p="anthro.${idx}.notes" value="${esc(e.notes||'')}" placeholder="Hora, ayuno, instrumento"></label>
    <button class="btn danger ghost" data-a="delAnthro">${S.confirm==='anthro'?'Pulsa otra vez para borrar':'Borrar medición'}</button>
  </div>
  <p class="muted" style="font-size:12px;margin:10px 0 0">Anota hasta tres medidas por punto. Con dos se hace la media; si la diferencia supera el 5 % en pliegues o el 1 % en el resto, mide una tercera y se toma la mediana (criterio ISAK). Los pliegues van en mm y lo demás en cm.</p>
  ${ISAK.map(g=>anthroGroup(e,g)).join('')}
  <div class="tiles" id="derived">${derivedHTML(e)}</div><div id="comp">${compHTML(c,e)}</div>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Σ6 = tríceps, subescapular, supraespinal, abdominal, muslo anterior y pantorrilla. Σ8 suma además bíceps y cresta ilíaca. Solo se calculan si están todos los puntos.</p></div>

function calendarHTML(c){

  let cells='',cn={asistio:0,falto:0,cancelo:0,prog:0};for(let i=0;i<off;i++)cells+='<span class="d blank"></span>';
  for(let d=1;d<=nd;d++){
    const iso=ym+'-'+String(d).padStart(2,'0');const s=sessionFor(c,iso);
    if(s)cn[s.status]++;
    cells+=`<button class="d ${s?s.status:''}${iso===today()?' today':''}${iso===S.calSel?' sel':''}" data-a="selDay" data-i="${iso}" aria-label="${fmtD(iso)}${s?', '+SESS[s.status]+(s.time?' a las '+fmtT(s.time):''):''}">${d}<span>${s?MARK[s.status]+(s.time?' '+fmtT(s.time):''):'&nbsp;'}</span></button>`;

async function renderReportCanvas(){

async function download(kind){
  const c=cur();if(!c)return;
  const base='Informe_'+(c.name||'cliente').replace(/[^\p{L}\p{N}]+/gu,'_')+'_'+today();
  try{
    toast('Preparando el informe…');
    const cv=await renderReportCanvas();
    if(kind==='png'){
      const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
      await saveFile(base+'.png',blob);
    }else{
      const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('lib');
      const w=cv.width/2,h=cv.height/2;
      const pdf=new J({unit:'px',format:[w,h],orientation:w>h?'l':'p',hotfixes:['px_scaling']});
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,w,h);
      await saveFile(base+'.pdf',new Blob([pdf.output('arraybuffer')],{type:'application/pdf'}));
    }
    toast('Informe listo');
  }catch(e){if(e&&e.code==='declined')return;toast('No se pudo generar el informe')}
}

  delClient(){
    if(S.confirm!=='del'){S.confirm='del';renderTab();return}
    const id=S.sel;S.confirm=null;delete S.clients[id];S.sel=null;
    S.deleted[id]=Date.now();saveDeleted();scheduleSync(1500);if(storeOk)Store.del('clients',id).catch(()=>toast('No se pudo borrar'));
    renderList();renderMain();toast('Cliente borrado');
  },
  addMetric(cat){
    const g=k=>$('#mf-'+cat+'-'+k).value.trim();
    const name=g('name'),val=toNum(g('val'));
    if(!name||val==null){toast('Indica la prueba y un valor numérico');return}
    const pre=PRESETS[cat].find(p=>p[0].toLowerCase()===name.toLowerCase());
    const c=cur();c.metrics=c.metrics||[];
    c.metrics.push({id:uid(),cat,date:g('date')||today(),name:pre?pre[0]:name,value:val,unit:g('unit')||(pre?pre[1]:'')});
    upd();renderTab();
  },
  delMetric(i){const c=cur();c.metrics=c.metrics.filter(m=>m.id!==i);upd();renderTab()},
  newAnthro(){const c=cur();c.anthro=c.anthro||[];const e={id:uid(),date:today(),side:'D',notes:'',v:{}};c.anthro.push(e);S.aSel=e.id;upd();renderTab()},
  measure(){S.tab='val';A.newAnthro()},
  delAnthro(){
    if(S.confirm!=='anthro'){S.confirm='anthro';renderTab();return}
    const c=cur();c.anthro=c.anthro.filter(x=>x.id!==S.aSel);S.aSel=null;S.confirm=null;upd();renderTab();toast('Medición borrada');
  },
  addDay(){const c=cur();c.plan=c.plan||{title:'Plan actual',days:[]};c.plan.days.push({name:'Día '+String.fromCharCode(65+c.plan.days.length),items:[{ex:'',sets:'',reps:'',load:'',note:''}]});upd();renderTab()},
  delDay(i){cur().plan.days.splice(+i,1);upd();renderTab()},
  addItem(i){cur().plan.days[+i].items.push({ex:'',sets:'',reps:'',load:'',note:''});upd();renderTab()},
  delItem(i,j){cur().plan.days[+i].items.splice(+j,1);upd();renderTab()},
  quick(st){setSession(today(),st);S.calMonth=today().slice(0,7);S.calSel=today();toast(st==='asistio'?'Sesión de hoy registrada':'Falta de hoy registrada');renderTab()},
  selDay(d){S.calSel=S.calSel===d?null:d;renderTab()},
  setStatus(st){setSession(S.calSel,st);renderTab()},
  clearDay(){const c=cur();c.sessions=c.sessions.filter(s=>s.date!==S.calSel);upd();renderTab()},
  calPrev(){const[y,m]=S.calMonth.split('-').map(Number);const d=new Date(y,m-2,1);S.calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');S.calSel=null;renderTab()},
  calNext(){const[y,m]=S.calMonth.split('-').map(Number);const d=new Date(y,m,1);S.calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');S.calSel=null;renderTab()},
  renewBono(){
    const c=cur(),b=c.bono||{},bo=bonoInfo(c);
    if(!b.total&&!b.name&&!b.price){toast('Rellena antes el bono actual');return}
    c.bonoHistory=c.bonoHistory||[];
    c.bonoHistory.push({type:b.type||'bono',name:b.name||'',total:b.total||'',start:b.start||'',end:today(),price:b.price,paid:!!b.paid,used:bo.used});
    c.bono={type:b.type||'bono',name:b.name||'',total:b.total||'',start:today(),expires:'',price:b.price||'',paid:false,paidDate:''};
    upd();renderTab();toast('Bono renovado: el anterior queda en el historial');
  },
  addGoal(){const t=$('#gf-text').value.trim();if(!t){toast('Escribe el objetivo');return}const c=cur();c.goals=c.goals||[];c.goals.push({text:t,date:$('#gf-date').value,done:false});upd();renderTab()},
  delGoal(i){cur().goals.splice(+i,1);upd();renderTab()},
  addNote(){const t=$('#nf-text').value.trim();if(!t){toast('Escribe la nota');return}const c=cur();c.notes=c.notes||[];c.notes.push({id:uid(),date:today(),text:t});upd();renderTab()},
  delNote(i){const c=cur();c.notes=c.notes.filter(n=>n.id!==i);upd();renderTab()},
  toggleEx(i,_j,el){const r=cur().report;r.exclude=r.exclude||[];const k=r.exclude.indexOf(i);if(el.checked){if(k>=0)r.exclude.splice(k,1)}else if(k<0)r.exclude.push(i);upd();refreshReport()},
  toggleAk(i,_j,el){const r=cur().report;r.akeys=r.akeys||[];const k=r.akeys.indexOf(i);if(el.checked){if(k<0)r.akeys.push(i)}else if(k>=0)r.akeys.splice(k,1);upd();refreshReport()},
  dlPng(){download('png')},dlPdf(){download('pdf')}
};
function refreshReport(){const w=$('#repwrap');if(w)w.innerHTML=reportHTML(cur())}
function anthroInput(t){
  const c=cur(),e=(c.anthro||[]).find(x=>x.id===S.aSel);if(!e)return;
  const k=t.dataset.ak,n=+t.dataset.ai;
  e.v=e.v||{};e.v[k]=e.v[k]||[null,null,null];
  e.v[k][n]=toNum(t.value);
  const g=ISAK.find(x=>x.sites.some(s=>s[0]===k));
  const f=fin(e.v[k]);
  $('#fv-'+k).innerHTML=`<b>${f==null?'—':num(f)}</b>`;
  $('#fd-'+k).innerHTML=diffCell(e.v[k],SITE[k].mass?0:g.tol);
  const dv=$('#derived');if(dv)dv.innerHTML=derivedHTML(e);
  if(t.dataset.cmpTimer===undefined){clearTimeout(anthroInput.t);anthroInput.t=setTimeout(()=>{const cm=$('#comp'),ae=document.activeElement;if(cm&&!(ae&&ae.closest&&ae.closest('#comp')))cm.innerHTML=compHTML(cur(),e)},400)}
  touch(S.sel);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;
  const f=A[b.dataset.a];if(f)f(b.dataset.i,b.dataset.j,b);
});
function onBind(e){
  const t=e.target;
  if(t.dataset.ak){if(e.type==='input')anthroInput(t);else{const ev=$('#evo');if(ev)ev.innerHTML=evoHTML(cur())}return}
  if(t.id==='cal-rpe'){const c=cur(),s=c&&(c.sessions||[]).find(x=>x.date===S.calSel);if(s){s.rpe=t.value.trim();touch(S.sel)}return}
  if((t.id==='dp-time'||t.id==='dp-dur')&&e.type==='change'){const c=cur(),s=c&&S.calSel&&ensureEntry(c,S.calSel);if(s){if(t.id==='dp-time')s.time=t.value;else s.dur=Number(t.value)||60;touch(S.sel);renderTab()}return}
  if(t.id==='asel'&&e.type==='change'){S.aSel=t.value;S.confirm=null;renderTab();return}
  if(t.id==='avar'&&e.type==='change'){S.avar=t.value;renderTab();return}
  if(t.dataset.a==='toggleEx'&&e.type==='change'){A.toggleEx(t.dataset.i,null,t);return}
  if(t.dataset.a==='toggleAk'&&e.type==='change'){A.toggleAk(t.dataset.i,null,t);return}
  const p=t.dataset.p;if(!p||!S.sel)return;
  const c=cur();let v;
  if(t.dataset.t==='check'){if(e.type!=='change')return;v=t.checked}
  else if(t.dataset.t==='num'){v=t.value===''?'':(toNum(t.value)==null?t.value:toNum(t.value))}
  else v=t.value;
  if(p==='report.days')v=Number(v);
  setP(c,p,v);touch(S.sel);
  if(p==='name'){const h=$('#hname');if(h)h.textContent=v||'Sin nombre'}
  if((p==='name'||p==='goal'||p==='semaforo')&&(e.type==='input'||p==='semaforo'))renderList();
  if((p.startsWith('sched.')||p==='bfMethod')&&e.type==='change'){renderTab();return}
  if(p==='tipo'||p==='bono.type'||(p.startsWith('anthro.')&&p.endsWith('.date')&&e.type==='change')){renderTab();if(p==='tipo')renderMain();return}
  if(p==='semaforo')renderMain();
  if(p.startsWith('report.')||p==='name'||p==='nextReview')refreshReport();
  if(t.dataset.t==='check'&&p.startsWith('goals.'))renderTab();
}
document.addEventListener('input',onBind);document.addEventListener('change',onBind);
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.tagName==='TEXTAREA')return;
  const id=e.target.id||'';
  const m=id.match(/^mf-(valoracion|carga)-/);if(m){A.addMetric(m[1]);return}
  if(id.startsWith('gf-'))A.addGoal();else if(id.startsWith('nf-'))A.addNote();else if(id.startsWith('tk-'))A.addTrack();
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderList()});
$('#trainer').addEventListener('input',e=>{S.trainer=e.target.value;clearTimeout(saveTrainer.t);saveTrainer.t=setTimeout(saveTrainer,700);refreshReport()});
document.addEventListener('change',e=>{
  const m=(e.target.id||'').match(/^mf-(valoracion|carga)-name$/);if(!m)return;
  const pre=PRESETS[m[1]].find(p=>p[0].toLowerCase()===e.target.value.trim().toLowerCase());
  const u=$('#mf-'+m[1]+'-unit');if(pre&&u&&!u.value)u.value=pre[1];
});

/* ---------- arranque y datos ---------- */
$('#syncfile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const inc=JSON.parse(await f.text());
    if(inc.app!=='seguimiento-clientes'||typeof inc.clients!=='object')throw new Error('formato');
    await snapshot('antes-de-actualizar');
    const st=await mergeData(inc);
    S.lastSync=Date.now();await Store.put('meta','lastSync',S.lastSync);
    scheduleSync(1500);S.syncMsg='Actualizado: '+st.added+' clientes nuevos, '+st.updated+' actualizados, '+st.removed+' borrados. Ahora, paso 2: guarda el archivo actualizado para que el otro dispositivo también reciba tus cambios.';
    S.sel=null;S.home='datos';S.homeOpen=true;await listBackups();renderList();renderMain();setSave('Actualizado '+fmtStamp(S.lastSync));
  }catch(err){toast('Ese archivo no es una copia de Seguimiento')}
});
async function boot(){
  renderList();renderMain();
  try{
    await Store.get('meta','trainer');storeOk=true;
    const all=await Store.all('clients');Object.keys(all).forEach(id=>S.clients[id]=all[id]);
    S.trainer=(await Store.get('meta','trainer'))||'';$('#trainer').value=S.trainer;
    S.deleted=(await Store.get('meta','deleted'))||{};S.lastSync=(await Store.get('meta','lastSync'))||null;S.cloud=(await Store.get('meta','cloud'))||null;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    await dailyBackup();await listBackups();
    setSave(S.lastSync?'Última actualización: '+fmtStamp(S.lastSync):'Guardado en este dispositivo');
  }catch(e){storeOk=false;setSave('Este navegador no permite guardar datos. Usa Safari o Chrome normales, no una ventana privada.')}
  S.loaded=true;renderList();renderMain();startAutoSync();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}

boot();
})();
</script>
</body>
